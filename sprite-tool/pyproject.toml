[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tamagotchi-sprite-animator"
version = "0.1.0"
description = "Deterministic offline pixel-art animation compiler"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.1,<13", "PyYAML>=6,<7", "jsonschema>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
sprite-anim = "sprite_animator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sprite_animator = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
