[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts =
  pre:tools/generate_tft_assets.py
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
build_src_filter =
  +<*>
  -<st7789_test.cpp>
  -<gpio_test.cpp>
  -<raw_st7789_test.cpp>
  -<hardware_st7789_test.cpp>
  -<hardware_expansion_test.cpp>
  -<deep_sleep_test.cpp>
  -<asset_flash_programmer.cpp>
  -<asset_storage_test.cpp>

[env:tamagotchi-30s-test]
platform = espressif32
board = esp32-c3-devkitm-1
